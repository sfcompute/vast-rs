[package]
name = "vast-rs"
version = "0.1.0"
edition = "2024"
description = "Rust client library for the VAST Data Management System REST API"
license = "MIT OR Apache-2.0"
keywords = ["vast", "storage", "api", "client"]
categories = ["api-bindings", "network-programming"]

# Project-wide lints. These catch the "no unwrap in library code" and
# "no debug prints" disciplines declared in README.md at compile time.
# `unwrap_used` / `expect_used` are scoped to the lib via inner attributes
# in `src/lib.rs` so tests can still use `.unwrap()` freely.
[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"

[lib]
name = "vast_rs"
path = "src/lib.rs"

[dependencies]
# HTTP client — rustls so we have no native-tls dependency
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
] }

# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Secret management — prevents tokens/passwords from appearing in logs/debug output
secrecy = { version = "0.8", features = ["serde"] }

# Observability
tracing = "0.1"

# URL handling
url = { version = "2", features = ["serde"] }

# HTTP mocking — only pulled in when the `mock` feature is enabled.
# Consumers add `vast-rs = { version = "...", features = ["mock"] }` to
# their `[dev-dependencies]` to access `vast_rs::mock::MockVastClient`.
wiremock = { version = "0.6", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# HTTP mocking for our own unit tests (always available regardless of features).
wiremock = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"

[features]
# Enable against a real VAST cluster:
#   VMS_ADDRESS=localhost:2443 VMS_TOKEN=<tok> cargo test --features integration
integration = []

# Enables `vast_rs::mock::MockVastClient`, a pre-built mock for consumers'
# unit tests. Adds an optional dependency on `wiremock`.
mock = ["dep:wiremock"]

[[test]]
name = "mock_tests"
path = "tests/mock_tests.rs"
required-features = ["mock"]

[package.metadata.docs.rs]
# Document the `mock` module on docs.rs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
